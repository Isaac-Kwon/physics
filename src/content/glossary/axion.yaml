id: axion
ko:
  term: 액시온
  definition: 매우 가볍고 물질과 거의 상호작용하지 않는다고 가정된 가상의 입자로, 암흑물질 후보 가운데 하나다.
en:
  term: axion
  definition: A hypothetical, extremely light particle that barely interacts with matter and is another candidate for dark matter.
it:
  term: assione
  definition: "Una particella ipotetica, estremamente leggera e quasi priva di interazioni con la materia, candidata anch'essa a costituire la materia oscura."
topics: [dark-matter]
reviewed: false
